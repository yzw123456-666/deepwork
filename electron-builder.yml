appId: com.deepwork.agent
productName: deepwork
copyright: Copyright © 2024 deepwork

directories:
  output: C:/manyai-build/release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - "!**/*.map"

asar: false

extraResources:
  - from: plugins
    to: plugins
  - from: resources/icon.png
    to: icon.png

# 独立更新器 / 卸载器（Python→PyInstaller 产物），随 app 一起分发，放在 app 根目录
# 由 tools/updater/build.py 生成（需先 pyinstaller 打包）
extraFiles:
  - from: tools/updater/dist/update.exe
    to: update.exe
  - from: tools/updater/dist/uninstall.exe
    to: uninstall.exe
  - from: tools/updater/sources.json
    to: sources.json


win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: deepwork
  language: 2052

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

publish:
  provider: generic
  url: ""

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: resources
  category: Development
